# LibreKiosk configuration. Installed to /etc/librekiosk/librekiosk.yml.
# Validated and applied by librekiosk-configure (at every boot, or `make configure`).
system:
  hostname: "librekiosk-{id}"   # {id} = last 6 hex of the PC's MAC, so 100 PCs from one ISO get different names
  user: "libre"                 # account used for the graphical session and Brave
  disable_screen_blanking: true # true = screen never goes black/off after idle (xset s off, -dpms)
  disable_suspend: true         # true = the PC never sleeps/hibernates (masks systemd sleep targets); false = default Debian behaviour
  volume: 40                    # output volume (0-100) set at every session start, unmuted

browser:
  homepage: "https://www.youtube.com/"
  fullscreen: false
  show_address_bar: true        # Brave cannot hide these separately: if either is
  show_tabs: true               # false, Brave runs in --app mode (no bar, no tabs)
  profile: "persistent"         # persistent = logins/cookies/passwords are saved (use this to set up services)
                                # locked = start from the saved profile but forget everything at reboot
  restart_on_crash: true
  shields: true

wifi:
  enabled: true
  ssid: "MyWifi"
  password: "CHANGE_ME"         # "CHANGE_ME" = not configured, Wi-Fi is skipped
  # Optional: keep credentials out of this file. The secrets file uses the same
  # wifi: {ssid, password} keys and should be `chmod 600`, root-owned, never in Git.
  secrets_file: ""              # e.g. /etc/librekiosk/secrets.yml
  autoconnect: true

kdeconnect:
  enabled: true
